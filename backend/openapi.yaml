openapi: 3.0.3
info:
  title: OrderBackend API
  version: 0.1.0
  description: Backend API for iPad food-booth ordering, sale item management, printer configuration, and order print job tracking.
servers:
  - url: http://127.0.0.1:8080
    description: Local backend
security:
  - basicAuth: []
paths:
  /health:
    get:
      summary: Health check
      security: []
      responses:
        "200":
          description: Backend is running
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
  /api/v1/catalog:
    get:
      summary: List active sale items
      description: Returns only sale items available for ordering.
      responses:
        "200":
          description: Active sale items
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SaleItem"
  /api/v1/sale-items:
    get:
      summary: List all sale items
      description: Returns active and inactive sale items for the settings screen.
      responses:
        "200":
          description: Sale items
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SaleItem"
    post:
      summary: Create a sale item
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SaleItemRequest"
      responses:
        "201":
          description: Created sale item
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SaleItem"
        "400":
          $ref: "#/components/responses/BadRequest"
  /api/v1/sale-items/{id}:
    parameters:
      - $ref: "#/components/parameters/ID"
    put:
      summary: Update a sale item
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SaleItemRequest"
      responses:
        "200":
          description: Updated sale item
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SaleItem"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      summary: Mark a sale item inactive
      responses:
        "204":
          description: Sale item marked inactive
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/v1/printers:
    get:
      summary: List printer configuration
      responses:
        "200":
          description: Cashier and kitchen printers
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Printer"
  /api/v1/printers/{role}:
    parameters:
      - $ref: "#/components/parameters/PrinterRole"
    get:
      summary: Load one printer configuration
      responses:
        "200":
          description: Printer configuration
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Printer"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
    put:
      summary: Save one printer configuration
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PrinterRequest"
      responses:
        "200":
          description: Saved printer configuration
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Printer"
        "400":
          $ref: "#/components/responses/BadRequest"
  /api/v1/order-summary:
    get:
      summary: Load order revenue summary
      description: Returns the count of orders with currently active sold items, total earned amount from those active items in cents, and active-item breakdown.
      responses:
        "200":
          description: Order revenue summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrderSummary"
  /api/v1/order-summary/print:
    post:
      summary: Print order revenue summary
      description: Sends the current active-item sales summary to the configured cashier printer and waits for the print attempt result.
      responses:
        "200":
          description: Sales summary sent to cashier printer
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PrintOrderSummaryResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "502":
          description: Printer command failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/v1/orders:
    get:
      summary: List orders
      responses:
        "200":
          description: Orders with item snapshots and print jobs
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Order"
    post:
      summary: Submit an order
      description: Saves the order, assigns an order number, creates cashier and kitchen print jobs, and returns immediately after persistence.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateOrderRequest"
      responses:
        "201":
          description: Created order
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Order"
        "400":
          $ref: "#/components/responses/BadRequest"
  /api/v1/orders/{id}:
    parameters:
      - $ref: "#/components/parameters/ID"
    get:
      summary: Load one order
      responses:
        "200":
          description: Order
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Order"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
  /orders:
    get:
      summary: Legacy order list
      deprecated: true
      responses:
        "200":
          description: Orders
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Order"
    post:
      summary: Legacy order submit
      deprecated: true
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LegacyOrderRequest"
      responses:
        "201":
          description: Created order
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Order"
        "400":
          $ref: "#/components/responses/BadRequest"
components:
  securitySchemes:
    basicAuth:
      type: http
      scheme: basic
  parameters:
    ID:
      name: id
      in: path
      required: true
      schema:
        type: integer
        format: int64
        minimum: 1
    PrinterRole:
      name: role
      in: path
      required: true
      schema:
        type: string
        enum:
          - cashier
          - kitchen
  responses:
    BadRequest:
      description: Invalid request
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
  schemas:
    HealthResponse:
      type: object
      required:
        - status
      properties:
        status:
          type: string
          example: ok
    ErrorResponse:
      type: object
      required:
        - error
      properties:
        error:
          type: string
          example: not found
    SaleItem:
      type: object
      required:
        - id
        - name
        - description
        - price_cents
        - active
        - created_at
        - updated_at
      properties:
        id:
          type: integer
          format: int64
          example: 1
        name:
          type: string
          example: Dumplings
        description:
          type: string
          example: Item description placeholder
        price_cents:
          type: integer
          minimum: 0
          example: 600
        active:
          type: boolean
          example: true
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    SaleItemRequest:
      type: object
      required:
        - name
        - price_cents
        - active
      properties:
        name:
          type: string
          example: Egg Tart
        description:
          type: string
          example: Warm custard tart
        price_cents:
          type: integer
          minimum: 0
          example: 350
        active:
          type: boolean
          example: true
    Printer:
      type: object
      required:
        - role
        - display_name
        - host
        - port
        - enabled
        - updated_at
      properties:
        role:
          type: string
          enum:
            - cashier
            - kitchen
        display_name:
          type: string
          example: Cashier Printer
        host:
          type: string
          example: 192.168.1.50
        port:
          type: integer
          minimum: 1
          maximum: 65535
          example: 9100
        enabled:
          type: boolean
          example: true
        updated_at:
          type: string
          format: date-time
    PrinterRequest:
      type: object
      required:
        - host
        - port
        - enabled
      properties:
        host:
          type: string
          example: 192.168.1.50
        port:
          type: integer
          minimum: 1
          maximum: 65535
          example: 9100
        enabled:
          type: boolean
          example: true
    CreateOrderRequest:
      type: object
      required:
        - items
      properties:
        items:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/CreateOrderItem"
    CreateOrderItem:
      type: object
      required:
        - sale_item_id
        - quantity
      properties:
        sale_item_id:
          type: integer
          format: int64
          minimum: 1
          example: 1
        quantity:
          type: integer
          minimum: 1
          example: 2
    Order:
      type: object
      required:
        - id
        - order_number
        - created_at
        - items
        - total_cents
      properties:
        id:
          type: integer
          format: int64
          example: 1
        order_number:
          type: string
          example: "1001"
        created_at:
          type: string
          format: date-time
        items:
          type: array
          items:
            $ref: "#/components/schemas/OrderItem"
        total_cents:
          type: integer
          minimum: 0
          example: 1650
        print_jobs:
          type: array
          items:
            $ref: "#/components/schemas/PrintJob"
    OrderSummary:
      type: object
      required:
        - order_count
        - total_cents
        - items
      properties:
        order_count:
          type: integer
          minimum: 0
          description: Number of orders that include at least one currently active sold item.
          example: 12
        total_cents:
          type: integer
          minimum: 0
          description: Total cents from sold items whose linked sale item is currently active.
          example: 84500
        items:
          type: array
          description: Per-item breakdown for sold items whose linked sale item is currently active.
          items:
            $ref: "#/components/schemas/OrderSummaryItem"
    OrderSummaryItem:
      type: object
      required:
        - name
        - description
        - quantity_sold
        - total_cents
      properties:
        name:
          type: string
          example: Dumplings
        description:
          type: string
          example: Pork dumplings
        quantity_sold:
          type: integer
          minimum: 0
          example: 14
        total_cents:
          type: integer
          minimum: 0
          example: 8400
    PrintOrderSummaryResponse:
      type: object
      required:
        - printer_role
        - summary
      properties:
        printer_role:
          type: string
          enum:
            - cashier
          example: cashier
        summary:
          $ref: "#/components/schemas/OrderSummary"
    OrderItem:
      type: object
      required:
        - name
        - description
        - unit_price_cents
        - quantity
        - subtotal_cents
      properties:
        id:
          type: integer
          format: int64
        sale_item_id:
          type: integer
          format: int64
        name:
          type: string
          example: Dumplings
        description:
          type: string
          example: Pork dumplings
        unit_price_cents:
          type: integer
          minimum: 0
          example: 600
        quantity:
          type: integer
          minimum: 1
          example: 2
        subtotal_cents:
          type: integer
          minimum: 0
          example: 1200
    PrintJob:
      type: object
      required:
        - id
        - order_id
        - printer_role
        - status
        - attempt_count
        - last_error
        - created_at
        - updated_at
      properties:
        id:
          type: integer
          format: int64
          example: 1
        order_id:
          type: integer
          format: int64
          example: 1
        printer_role:
          type: string
          enum:
            - cashier
            - kitchen
        status:
          type: string
          enum:
            - pending
            - sent
            - skipped
            - failed
        attempt_count:
          type: integer
          minimum: 0
          example: 1
        last_error:
          type: string
          example: printer is not configured
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    LegacyOrderRequest:
      type: object
      required:
        - items
        - total
      properties:
        items:
          type: array
          minItems: 1
          items:
            type: object
            required:
              - name
              - price
              - quantity
            properties:
              name:
                type: string
                example: Milk Tea
              price:
                type: number
                format: double
                minimum: 0
                example: 4.5
              quantity:
                type: integer
                minimum: 1
                example: 2
        total:
          type: number
          format: double
          minimum: 0
          example: 9
