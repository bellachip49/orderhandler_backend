services:
  orderbackend:
    container_name: orderbackend
    build: .
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8080}:8080"
    environment:
      HOST: 0.0.0.0
      PORT: 8080
      DB_PATH: /data/orders.db
      BASIC_AUTH_USERNAME: ${BASIC_AUTH_USERNAME:-admin}
      BASIC_AUTH_PASSWORD: ${BASIC_AUTH_PASSWORD:-orderbackend}
    volumes:
      - orders-data:/data
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1:8080/health"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s

  swagger-ui:
    image: swaggerapi/swagger-ui:v5.17.14
    container_name: orderbackend-swagger-ui
    restart: unless-stopped
    ports:
      - "${SWAGGER_PORT:-8088}:8080"
    environment:
      SWAGGER_JSON: /spec/openapi.yaml
    volumes:
      - ./openapi.yaml:/spec/openapi.yaml:ro
    depends_on:
      - orderbackend

volumes:
  orders-data:
